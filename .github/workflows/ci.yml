# Builds and tests the core on macOS, Linux and Windows so that portability
# does not rot. The core must build without JUCE on all three.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (universal, ASan+UBSan)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyatv (integration sender)
        run: |
          python3 -m venv venv
          venv/bin/pip install --quiet -r tests/integration/requirements.txt
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DTAPEIN_SANITIZE=address,undefined
          -DTAPEIN_INTEGRATION=ON
          -DTAPEIN_ATVREMOTE=${{ github.workspace }}/venv/bin/atvremote
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Build the app (no sanitizer; compile check + artifact)
        run: >
          cmake -S . -B build-app -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DTAPEIN_BUILD_TESTS=OFF
          -DTAPEIN_BUILD_APP=ON
          && cmake --build build-app --parallel --target TapeIn
      - name: Package the app
        run: |
          cd "build-app/app/TapeIn_artefacts/Release"
          ditto -c -k --keepParent "Tape In.app" "Tape In.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TapeIn-app-unsigned
          path: build-app/app/TapeIn_artefacts/Release/Tape In.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.compiler }} (${{ matrix.sanitize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            sanitize: address,undefined
          - compiler: clang
            cc: clang
            cxx: clang++
            sanitize: address,undefined
          - compiler: clang
            cc: clang
            cxx: clang++
            sanitize: thread
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyatv (integration sender)
        run: |
          python3 -m venv venv
          venv/bin/pip install --quiet -r tests/integration/requirements.txt
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTAPEIN_SANITIZE=${{ matrix.sanitize }}
          -DTAPEIN_INTEGRATION=ON
          -DTAPEIN_ATVREMOTE=${{ github.workspace }}/venv/bin/atvremote
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Fuzz (clang only, 60 s per harness)
        if: matrix.compiler == 'clang' && matrix.sanitize == 'address,undefined'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTAPEIN_SANITIZE=address,undefined -DTAPEIN_FUZZ=ON -DTAPEIN_BUILD_TOOLS=OFF
          cmake --build build-fuzz --parallel --target fuzz_rtsp_parser fuzz_sdp fuzz_rtp fuzz_alac
          for h in rtsp_parser sdp rtp alac; do
            mkdir -p fuzz-work/$h
            ./build-fuzz/tests/fuzz/fuzz_$h -max_total_time=60 -max_len=2048 fuzz-work/$h tests/fuzz/corpus/$h
          done

  windows:
    name: Windows MSVC (ASan)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTAPEIN_SANITIZE=address
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
